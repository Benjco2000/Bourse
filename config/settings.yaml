# Configuration de l'application Bourse.
# Tout ce qui est "métier" (univers, fréquences, hypothèses) est ici, pas dans le code.

universe:
  # Tickers suivis par le pipeline. Ajoutez/retirez librement.
  # Budget API : ~19 appels par ticker au premier chargement, ~9 par ticker les jours suivants
  # (les états financiers ne sont rafraîchis qu'une fois par semaine).
  # Plan gratuit (250 appels/jour) : le premier chargement de 20 tickers s'étale sur 2 jours
  # (le pipeline reprend automatiquement là où il s'est arrêté).
  tickers:
    # MVP : 3 groupes de pairs (les concurrents affichés en page 1 sont dans l'univers)
    # Technologie / plateformes
    - MSFT
    - AAPL
    - GOOGL
    - META
    # Biens de consommation de base
    - KO
    - PEP
    - PG
    # Paiements
    - V
    - MA
    - AXP
  # Groupes de pairs explicites (prioritaires sur l'endpoint "peers" de FMP). Modifiables librement.
  peer_groups:
    tech_platforms: [MSFT, AAPL, GOOGL, META]
    consumer_staples: [KO, PEP, PG]
    payments: [V, MA, AXP]
  # true = ajoute automatiquement les constituants du S&P 500 (≈ 500 tickers × ~20 appels).
  # Attention : nécessite un plan FMP payant (quota quotidien du plan gratuit ≈ 250 appels).
  include_sp500: false

api:
  # Votre plan FMP : basic (gratuit) | starter | premium
  # "basic" : 5 exercices max, pas de trimestriel, ni news/initiés/S&P 500 (évite des appels refusés)
  # "starter" : tout sauf la liste du S&P 500 (endpoint refusé en Starter)
  plan: starter
  base_url: https://financialmodelingprep.com/stable
  # Quota du plan : Starter = 300/min, Premium = 750/min. Gardez une marge.
  requests_per_minute: 300
  max_workers: 8
  timeout_seconds: 30
  max_retries: 4

# Fréquence de rafraîchissement par jeu de données (en heures).
# Le pipeline peut tourner tous les jours : un jeu de données "frais" n'est pas re-téléchargé,
# ce qui économise le quota API. `--force` ignore ces fréquences.
refresh_hours:
  daily: 20      # cotations, prix, news, consensus analystes, dividendes...
  weekly: 164    # états financiers, ratios annuels, profil, scores...

history:
  prices_start: "2008-01-01"      # premier chargement des prix / capitalisations journaliers
  annual_statements_limit: 20     # nb d'exercices annuels récupérés (KPIs 5 ans à des dates passées, ML)
  quarterly_statements_limit: 40  # nb de trimestres (TTM point-in-time sur ~10 ans, multiples historiques)
  news_history_days: 365         # profondeur du premier chargement des actualités (Starter : 1 an max)

valuation:
  # Hypothèses par défaut — modifiables aussi en direct dans l'onglet "Valorisation" de l'app.
  discount_rate: 0.09          # taux d'actualisation du DCF
  terminal_growth: 0.025       # croissance perpétuelle
  high_growth_years: 5         # années de croissance "élevée", suivies d'autant d'années de convergence
  max_growth: 0.15             # plafond de croissance utilisé (prudence à la Graham)
  min_growth: -0.05
  # Formule révisée de Graham : V = EPS × (8.5 + 2g) × 4.4 / Y
  # Y = rendement des obligations AAA. "auto" = taux 10 ans US (FMP) + spread ci-dessous.
  aaa_yield: auto
  aaa_spread: 0.008
  aaa_yield_fallback: 0.05
  # Méthodes prises en compte dans la "juste valeur" composite (médiane)
  composite_methods: [graham_number, graham_formula, dcf, pe_multiple]
  # Seuils de verdict sur la marge de sécurité
  undervalued_mos: 0.20
  overvalued_mos: -0.10

graham:
  # Critères de l'investisseur défensif (The Intelligent Investor, ch. 14), seuils modernisés
  min_revenue: 2000000000          # "taille suffisante" (100 M$ en 1971 ≈ 2 Md$ aujourd'hui)
  min_current_ratio: 2.0
  earnings_stability_years: 10
  dividend_record_years: 20
  min_eps_growth: 0.33        # croissance de l'EPS moyen (3 ans) sur 10 ans
  max_pe: 15
  max_pb: 1.5
  max_pe_x_pb: 22.5

# --------------------------------------------------------------------------- KPIs fondamentaux (page 1)
# Seuils indicatifs "favorables". direction: higher = plus haut est mieux, lower = plus bas est mieux.
kpis:
  revenue_cagr_5y:        {threshold: 0.10, direction: higher}
  fcf_cagr_5y:            {threshold: 0.10, direction: higher}
  share_change_5y:        {threshold: 0.0,  direction: lower}
  roce_avg_5y:            {threshold: 0.15, direction: higher}
  net_debt_to_fcf:        {threshold: 3.0,  direction: lower}
  gross_margin_ttm:       {threshold: 0.15, direction: higher}
  fcf_margin_ttm:         {threshold: 0.15, direction: higher}
  lookback_years: 5
  # En-dessous de ce nombre d'années d'historique, un KPI "5 ans" est marqué "historique insuffisant" (orange)
  min_years_for_5y: 5
  default_tax_rate: 0.21      # taux d'IS utilisé si le taux effectif n'est pas calculable (NOPAT)

# Délai de publication supposé quand la date de dépôt n'est pas fournie par la source (anti look-ahead)
availability_lag_days:
  annual: 90
  quarter: 45

# Tranches de capitalisation (USD) pour la segmentation ML
cap_buckets:
  small: 2000000000
  mid: 10000000000
  large: 100000000000

# --------------------------------------------------------------------------- Textes générés par IA
# provider: openai (clé OPENAI_API_KEY) ou anthropic (clé ANTHROPIC_API_KEY), dans .env.
# Sans clé, aucun texte IA n'est généré (seuls les textes sourcés sont affichés).
llm:
  enabled: true
  max_articles_scored_per_run: 400   # plafond de coût : articles notés par le LLM à chaque run (cache par URL)
  provider: openai
  model: gpt-6-luna      # modèle économique d'OpenAI ; "gpt-6.2-sol" pour plus de qualité (plus cher)

# --------------------------------------------------------------------------- Actualités & sentiment (page 3)
news:
  synthesis_window_days: 30     # articles pris en compte pour la synthèse IA
  synthesis_max_articles: 40
  min_articles_for_synthesis: 3
  positive_threshold: 0.15      # score moyen > seuil -> positif ; < -seuil -> négatif ; sinon neutre

# --------------------------------------------------------------------------- Valorisation IA (page 4)
ml:
  data_subdir: ml                     # lac de données ML séparé : data/ml/{bronze,silver,core,gold,ops}
  universe_file: config/universe_ml.csv
  universe:
    # Plan Starter = actions US uniquement (CAC 40, Nikkei... exigent le plan Ultimate)
    country: US
    exchanges: [NYSE, NASDAQ]
    min_market_cap: 2000000000        # 2 Md$
    max_tickers: 1000                 # les plus grosses capitalisations
    # P/FCF peu pertinent pour ces modèles économiques (bilan = outil de production) : exclus du dataset
    exclude_industry_keywords: [Bank, Insurance, REIT, Mortgage, Asset Management, Capital Markets, Shell Companies]
  datasets: [profile, income_statement_annual, income_statement_quarter, balance_sheet_annual,
             balance_sheet_quarter, cash_flow_annual, cash_flow_quarter, market_cap_history]
  observations:
    start: "2012-12-31"               # première date d'observation (fin de trimestre)
    max_ttm_age_days: 460
  target:
    min_pfcf: 1                       # P/FCF hors [1 ; 150] : exclus (comptés et documentés)
    max_pfcf: 150
  split:                              # chronologique, avec embargo entre les blocs
    train_end: "2020-12-31"
    val_start: "2021-07-01"
    val_end: "2022-12-31"
    test_start: "2023-07-01"
    unseen_companies_share: 0.2       # part des sociétés exclues de l'entraînement (test « sociétés jamais vues »)
  n_jobs: 0                           # processus pour construire le dataset (0 = nb de cœurs - 1)
  min_sector_obs: 1500                # modèles par secteur seulement au-delà de ce volume d'entraînement
  usability:                          # en dessous : modèle "non exploitable", aucun prix affiché
    min_train_obs: 5000
    min_companies: 300
    must_beat_baseline: true
  simplicity_tolerance: 0.02          # un modèle plus simple à moins de 2 % du meilleur est préféré
  registry:
    model_name: bourse_pfcf
    tracking_uri: ""                  # vide = sqlite local dans data/ml/mlflow.db ; "databricks" en phase 2
    registry_uri: ""                  # vide = idem ; "databricks-uc" en phase 2
